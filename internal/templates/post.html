{{ define "content" }}

<article class="post-container">
    <div class="post-header">
        <h1>{{ .Data.Post.Title.Rendered }}</h1>
        <div class="post-date">{{ .Data.Post.Date }}</div>
    </div>

    <div class="post-content">
        {{ .Data.Post.Content.Rendered | safeHTML }}
    </div>
</article>

{{ end }}
