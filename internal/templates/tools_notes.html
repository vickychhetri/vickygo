{{ define "content" }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    .tool-container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .tool-header h1 { font-size: 2rem; margin-bottom: 10px; color: var(--accent); }
    .tool-header p { color: var(--text-secondary); margin-bottom: 30px; }
    .panel { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    textarea { width: 100%; min-height: 250px; background: var(--bg-main); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-size: 1rem; font-family: var(--font-sans); resize: vertical; outline: none; line-height: 1.6; }
    textarea:focus { border-color: var(--accent); }
    .controls { display: flex; gap: 15px; align-items: center; margin-top: 15px; flex-wrap: wrap; }
    select { padding: 10px 15px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); outline: none; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-copy { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
    .btn-copy:hover { background: var(--bg-main); }
    .share-box { background: var(--bg-main); padding: 20px; border-radius: 8px; border: 1px solid var(--accent); margin-top: 20px; display: none; }
    .share-link { font-family: var(--font-mono); word-break: break-all; color: var(--accent); font-size: 0.95rem; }
    .note-viewer { background: var(--bg-main); padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); white-space: pre-wrap; line-height: 1.7; font-size: 1.05rem; }
    .expiry-banner { background: rgba(13, 148, 136, 0.1); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 15px; color: var(--accent); font-size: 0.9rem; margin-bottom: 20px; }
</style>

<div class="tool-container">
    <div class="tool-header">
        <h1>Temporary Notes Share</h1>
        <p>Paste text, get a shareable link with auto-expiry. No account needed.</p>
    </div>

    <div id="view-mode" class="panel" style="display:none;">
        <div class="expiry-banner" id="expiry-banner"></div>
        <div class="note-viewer" id="note-content"></div>
        <div class="controls" style="margin-top: 20px;">
            <a href="/tools/notes/" class="btn btn-copy"><i class="fas fa-plus"></i> Create New Note</a>
            <button class="btn btn-copy" onclick="copyNote()"><i class="fas fa-copy"></i> Copy Content</button>
        </div>
    </div>

    <div id="create-mode" class="panel">
        <textarea id="note-text" placeholder="Paste your notes, code snippets, logs, or anything you want to share temporarily..."></textarea>
        <div class="controls">
            <select id="expiry-select">
                <option value="1h">Expires in 1 Hour</option>
                <option value="24h" selected>Expires in 24 Hours</option>
                <option value="168h">Expires in 7 Days</option>
            </select>
            <button class="btn btn-primary" id="share-btn"><i class="fas fa-share-alt"></i> Generate Link</button>
        </div>
        <div class="share-box" id="share-box">
            <p style="margin: 0 0 10px 0; font-weight: bold;"><i class="fas fa-check-circle" style="color: var(--accent);"></i> Your note is ready!</p>
            <div class="share-link" id="share-link"></div>
            <div class="controls" style="margin-top: 15px;">
                <button class="btn btn-primary" onclick="copyShareLink()"><i class="fas fa-copy"></i> Copy Link</button>
            </div>
        </div>
    </div>
</div>

<script>
    const noteId = new URLSearchParams(window.location.search).get('id');

    if (noteId) {
        document.getElementById('create-mode').style.display = 'none';
        document.getElementById('view-mode').style.display = 'block';
        
        fetch('/api/notes/?id=' + noteId)
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('note-content').textContent = '⚠️ ' + data.error;
                    document.getElementById('expiry-banner').textContent = 'This note has expired or does not exist.';
                    document.getElementById('expiry-banner').style.background = 'rgba(239,68,68,0.1)';
                    document.getElementById('expiry-banner').style.borderColor = '#ef4444';
                    document.getElementById('expiry-banner').style.color = '#ef4444';
                } else {
                    document.getElementById('note-content').textContent = data.content;
                    const exp = new Date(data.expires);
                    document.getElementById('expiry-banner').innerHTML = '<i class="fas fa-clock"></i> This note expires on ' + exp.toLocaleString();
                }
            });
    }

    document.getElementById('share-btn').addEventListener('click', async () => {
        const content = document.getElementById('note-text').value.trim();
        if (!content) { alert('Please enter some content first.'); return; }
        
        const btn = document.getElementById('share-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        
        const res = await fetch('/api/notes/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ content, expiry: document.getElementById('expiry-select').value })
        });
        const data = await res.json();
        
        btn.innerHTML = '<i class="fas fa-share-alt"></i> Generate Link';
        
        if (data.error) { alert(data.error); return; }
        
        const link = window.location.origin + '/tools/notes/?id=' + data.id;
        document.getElementById('share-link').textContent = link;
        document.getElementById('share-box').style.display = 'block';
    });

    function copyShareLink() {
        navigator.clipboard.writeText(document.getElementById('share-link').textContent);
        alert('Link copied!');
    }
    function copyNote() {
        navigator.clipboard.writeText(document.getElementById('note-content').textContent);
    }
</script>
{{ end }}
