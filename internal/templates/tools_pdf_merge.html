{{ define "content" }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    .tool-container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .tool-header h1 { font-size: 2.2rem; margin-bottom: 10px; color: var(--accent); }
    .tool-header p { color: var(--text-secondary); margin-bottom: 30px; }
    
    .panel { background: var(--bg-card); padding: 40px 30px; border-radius: 16px; border: 1px solid var(--border-color); }
    
    .drop-zone {
        border: 2px dashed var(--border-color); border-radius: 12px; padding: 50px 20px;
        text-align: center; cursor: pointer; transition: all 0.3s; background: rgba(255,255,255,0.01);
        margin-bottom: 25px;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(45, 212, 191, 0.03); }
    .drop-zone i { font-size: 3.5rem; color: var(--accent); margin-bottom: 15px; }
    
    .file-list { margin-bottom: 25px; text-align: left; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; }
    .file-name { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 0.95rem; }
    .file-name i { color: #ef4444; }
    .file-size { font-size: 0.85rem; color: var(--text-muted); }
    
    .btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .loader { display: none; flex-direction: column; align-items: center; margin-top: 20px; }
    .spinner { width: 35px; height: 35px; border: 4px solid rgba(45, 212, 191, 0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>

<div class="tool-container">
    <div class="tool-header">
        <h1><i class="fas fa-file-pdf"></i> PDF Merge Tool</h1>
        <p>Combine multiple PDF files into a single, organized document. Quick, secure, processed securely in memory.</p>
    </div>

    <div class="panel">
        <form id="merge-form" enctype="multipart/form-data">
            <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <i class="fas fa-layer-group"></i>
                <h3>Select or Drop PDF Files</h3>
                <p style="color: var(--text-secondary); margin-top: 8px;">Select 2 or more PDF documents to merge</p>
            </div>
            <!-- Multiple files allowed -->
            <input type="file" id="file-input" name="files" style="display:none;" accept=".pdf" multiple>

            <div class="file-list" id="file-list"></div>

            <button type="submit" class="btn" id="merge-btn" disabled><i class="fas fa-compress-arrows-alt"></i> Merge PDFs</button>
        </form>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--accent); font-weight: 500;">Merging PDFs on server...</p>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileListContainer = document.getElementById('file-list');
    const mergeBtn = document.getElementById('merge-btn');
    const mergeForm = document.getElementById('merge-form');
    const loader = document.getElementById('loader');
    
    let selectedFiles = [];

    // Drag events
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }, false);
    });

    dropZone.addEventListener('drop', (e) => {
        const files = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
        if (files.length > 0) addFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length > 0) addFiles(files);
    });

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function addFiles(files) {
        selectedFiles = [...selectedFiles, ...files];
        renderFileList();
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
    }

    function renderFileList() {
        fileListContainer.innerHTML = '';
        selectedFiles.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-name">
                    <i class="fas fa-file-pdf"></i>
                    <span>${file.name}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span class="file-size">${formatBytes(file.size)}</span>
                    <i class="fas fa-times-circle" style="color: var(--text-muted); cursor: pointer; font-size: 1.1rem;" onclick="removeFile(${index})"></i>
                </div>
            `;
            fileListContainer.appendChild(item);
        });

        // Need at least 2 files to merge
        mergeBtn.disabled = selectedFiles.length < 2;
    }

    mergeForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (selectedFiles.length < 2) return;

        mergeBtn.style.display = 'none';
        loader.style.display = 'flex';

        const formData = new FormData();
        selectedFiles.forEach(file => {
            formData.append('files', file);
        });

        try {
            const res = await fetch('/api/pdf/merge/', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const data = await res.json();
                alert(data.error || "Failed to merge PDF files.");
                mergeBtn.style.display = 'flex';
                loader.style.display = 'none';
                return;
            }

            // download response as PDF blob
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'merged.pdf';
            a.click();

            // Clear inputs
            selectedFiles = [];
            renderFileList();

        } catch (error) {
            console.error(error);
            alert("Error communicating with server.");
        } finally {
            mergeBtn.style.display = 'flex';
            loader.style.display = 'none';
        }
    });
</script>
{{ end }}
