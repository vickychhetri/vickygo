{{ define "content" }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    .tool-container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    .tool-header h1 { font-size: 2rem; margin-bottom: 10px; color: var(--accent); }
    .tool-header p { color: var(--text-secondary); margin-bottom: 30px; }
    
    .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }
    
    .panel { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
    
    .preview-area { width: 100%; height: 350px; background: #ffffff; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 1px solid var(--border-color);}
    .box-target { width: 200px; height: 200px; background: #ffffff; border-radius: 8px; transition: box-shadow 0.1s;}
    
    .code-box { background: var(--bg-main); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-primary); }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--text-primary); font-weight: 500; font-size: 0.95rem;}
    
    .slider { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: var(--bg-main); border: 1px solid var(--border-color); outline: none; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
    
    .color-picker { display: flex; align-items: center; gap: 10px; }
    input[type="color"] { -webkit-appearance: none; border: none; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; padding: 0; background: none; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-color); border-radius: 8px; }
    
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-top: 15px;}
    .btn:hover { opacity: 0.9; }
</style>

<div class="tool-container">
    <div class="tool-header">
        <h1>CSS Box Shadow Generator</h1>
        <p>Interactive slider tool to design CSS box shadows and instantly copy the code.</p>
    </div>

    <div class="workspace">
        <div class="panel">
            <div class="form-group">
                <label>Horizontal Offset (X) <span id="val-x">0px</span></label>
                <input type="range" class="slider" id="inp-x" min="-50" max="50" value="0">
            </div>
            <div class="form-group">
                <label>Vertical Offset (Y) <span id="val-y">10px</span></label>
                <input type="range" class="slider" id="inp-y" min="-50" max="50" value="10">
            </div>
            <div class="form-group">
                <label>Blur Radius <span id="val-blur">20px</span></label>
                <input type="range" class="slider" id="inp-blur" min="0" max="100" value="20">
            </div>
            <div class="form-group">
                <label>Spread Radius <span id="val-spread">-5px</span></label>
                <input type="range" class="slider" id="inp-spread" min="-50" max="50" value="-5">
            </div>
            
            <div style="display:flex; gap:20px;">
                <div class="form-group" style="flex:1;">
                    <label>Shadow Color</label>
                    <div class="color-picker">
                        <input type="color" id="inp-color" value="#000000">
                    </div>
                </div>
                <div class="form-group" style="flex:2;">
                    <label>Opacity <span id="val-opacity">0.2</span></label>
                    <input type="range" class="slider" id="inp-opacity" min="0" max="1" step="0.01" value="0.2">
                </div>
            </div>
            
            <div class="form-group" style="margin-top: 10px;">
                <label style="display:inline-flex; align-items:center; gap:10px; cursor:pointer;">
                    <input type="checkbox" id="inp-inset" style="width:16px; height:16px;">
                    Inset Shadow
                </label>
            </div>
        </div>

        <div>
            <div class="preview-area">
                <div class="box-target" id="box-target"></div>
            </div>
            <div class="code-box">
                <span style="color:var(--text-secondary);">box-shadow:</span> <span id="code-str">0px 10px 20px -5px rgba(0, 0, 0, 0.2);</span>
            </div>
            <button class="btn" id="btn-copy"><i class="fas fa-copy"></i> Copy CSS</button>
        </div>
    </div>
</div>

<script>
    const x = document.getElementById('inp-x');
    const y = document.getElementById('inp-y');
    const blur = document.getElementById('inp-blur');
    const spread = document.getElementById('inp-spread');
    const color = document.getElementById('inp-color');
    const opacity = document.getElementById('inp-opacity');
    const inset = document.getElementById('inp-inset');
    
    const target = document.getElementById('box-target');
    const codeStr = document.getElementById('code-str');

    function hexToRgba(hex, alpha) {
        let r = parseInt(hex.slice(1, 3), 16),
            g = parseInt(hex.slice(3, 5), 16),
            b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function update() {
        document.getElementById('val-x').textContent = x.value + 'px';
        document.getElementById('val-y').textContent = y.value + 'px';
        document.getElementById('val-blur').textContent = blur.value + 'px';
        document.getElementById('val-spread').textContent = spread.value + 'px';
        document.getElementById('val-opacity').textContent = opacity.value;
        
        const rgbaColor = hexToRgba(color.value, opacity.value);
        const insetString = inset.checked ? 'inset ' : '';
        
        const cssValue = `${insetString}${x.value}px ${y.value}px ${blur.value}px ${spread.value}px ${rgbaColor}`;
        
        target.style.boxShadow = cssValue;
        codeStr.textContent = cssValue + ';';
    }

    [x, y, blur, spread, color, opacity, inset].forEach(el => el.addEventListener('input', update));

    document.getElementById('btn-copy').addEventListener('click', () => {
        navigator.clipboard.writeText(`box-shadow: ${codeStr.textContent}`);
        const btn = document.getElementById('btn-copy');
        btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Copy CSS', 2000);
    });

    update();
</script>
{{ end }}
