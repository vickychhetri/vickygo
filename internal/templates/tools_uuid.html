{{ define "content" }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    .tool-container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    .tool-header h1 { font-size: 2rem; margin-bottom: 10px; color: var(--accent); }
    .tool-header p { color: var(--text-secondary); margin-bottom: 30px; }
    
    .uuid-controls {
        display: flex;
        gap: 20px;
        background: var(--bg-card);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        margin-bottom: 20px;
        align-items: center;
        flex-wrap: wrap;
    }
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .control-group label { font-size: 0.9rem; color: var(--text-secondary); }
    .control-group select, .control-group input {
        padding: 10px;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-primary);
        outline: none;
    }
    .btn {
        padding: 12px 24px;
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
    }
    
    .uuid-results {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
    }
    .uuid-list {
        width: 100%;
        height: 400px;
        background: var(--bg-main);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        font-family: 'Courier New', monospace;
        font-size: 1.1rem;
        resize: vertical;
    }
    .uuid-list:focus { outline: none; border-color: var(--accent); }
</style>

<div class="tool-container">
    <div class="tool-header">
        <h1>UUID Generator</h1>
        <p>Fast, cryptographically secure bulk UUID generation (v4 and v7).</p>
    </div>

    <div class="uuid-controls">
        <div class="control-group">
            <label>Version</label>
            <select id="uuid-version">
                <option value="4">v4 (Random)</option>
                <option value="7">v7 (Time-based)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Quantity</label>
            <input type="number" id="uuid-count" value="5" min="1" max="1000">
        </div>
        <div class="control-group" style="justify-content: flex-end; margin-left: auto;">
            <button class="btn" id="generate-btn">Generate UUIDs</button>
        </div>
    </div>

    <div class="uuid-results">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <h3 style="margin: 0;">Results</h3>
            <button class="btn btn-secondary" style="padding: 6px 12px;" id="copy-btn"><i class="fas fa-copy"></i> Copy</button>
        </div>
        <textarea id="uuid-list" class="uuid-list" readonly></textarea>
    </div>
</div>

<script>
    document.getElementById('generate-btn').addEventListener('click', async () => {
        const version = document.getElementById('uuid-version').value;
        const count = document.getElementById('uuid-count').value;
        
        try {
            const res = await fetch(`/api/uuid?v=${version}&count=${count}`);
            const data = await res.json();
            if(data.uuids) {
                document.getElementById('uuid-list').value = data.uuids.join('\n');
            } else {
                alert(data.error || "Failed to generate");
            }
        } catch(e) {
            alert("Error communicating with backend");
        }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
        const text = document.getElementById('uuid-list');
        text.select();
        document.execCommand('copy');
        
        const btn = document.getElementById('copy-btn');
        btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => {
            btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
        }, 2000);
    });
</script>
{{ end }}
